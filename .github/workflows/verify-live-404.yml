name: Verify live 404

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  contents: read

jobs:
  verify-live-404:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify custom 404 response
        shell: bash
        run: |
          url="https://pradharakotambage.com/t11-deliberately-missing-page-check/"
          body="$(mktemp)"
          status="$(curl --silent --show-error --location --output "$body" --write-out "%{http_code}" "$url")"
          test "$status" = "404"
          grep -Fq "We could not find that page." "$body"
          grep -Fq 'href="/legal-guides/"' "$body"
          grep -Fq 'href="/legal-guides/all/"' "$body"
