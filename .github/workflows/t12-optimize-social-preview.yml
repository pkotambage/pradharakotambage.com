name: T12 optimize social preview

on:
  push:
    branches: [main]
    paths:
      - "scripts/t12-optimize-social-preview.py"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Optimize and standardize previews
        run: python scripts/t12-optimize-social-preview.py
      - name: Show resulting image
        run: |
          file assets/images/social-preview.jpg
          du -h assets/images/social-preview.jpg
          git diff --stat
      - name: Commit generated T12 changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/social-preview.jpg '*.html' scripts/templates scripts/guide-register.json scripts/*.py || true
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Optimize and standardize social preview assets"
          git push
