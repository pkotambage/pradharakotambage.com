name: Performance baseline

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/performance-baseline.yml"
      - "scripts/run-performance-baseline.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Confirm Chrome
        run: google-chrome --version
      - name: Run repeatable Lighthouse baseline
        run: node scripts/run-performance-baseline.mjs
      - name: Show baseline summary
        if: always()
        run: cat performance-baseline/summary.md || true
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-baseline
          path: performance-baseline/
          retention-days: 90
